name: Weekly design report
on:
  schedule:
    - cron: '30 23 * * 0'
    - cron: '0 0 * * 1'
    - cron: '30 7 * * 5'
    - cron: '0 8 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: Report format to validate or publish
        type: choice
        options: [monday, friday]
        default: friday
      publish:
        description: Publish the selected report (requires its enabled switch and same-day two-hour window)
        type: boolean
        default: false
      reformat_existing:
        description: Restore native short tables in an existing reply without changing report facts
        type: boolean
        default: false
      correct_existing_date:
        description: Existing report ISO date to repair using the private reviewed correction (never creates a parent)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: design-weekly
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
      (((github.event.schedule == '0 0 * * 1' || github.event.schedule == '30 23 * * 0') && vars.MONDAY_REPORTS_ENABLED == 'true') ||
      ((github.event.schedule == '0 8 * * 5' || github.event.schedule == '30 7 * * 5') && vars.FRIDAY_REPORTS_ENABLED == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline validation
        run: python3 -m unittest test_weekly_report.py test_report_accuracy.py test_board_weekly.py
      - name: Build and verify weekly report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_POLICY: ${{ secrets.REPORT_POLICY }}
          BOARD_CONFIG: ${{ secrets.BOARD_CONFIG }}
          REPORT_CORRECTION: ${{ inputs.correct_existing_date != '' && secrets.REPORT_CORRECTION || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_NAME: ${{ vars.SLACK_CHANNEL_NAME }}
          SLACK_BOT_USER_ID: ${{ vars.SLACK_BOT_USER_ID }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
          SLACK_GROUP_MENTION: ${{ vars.SLACK_GROUP_MENTION }}
          SLACK_WORKSPACE_URL: ${{ vars.SLACK_WORKSPACE_URL }}
          REPORT_MODE: ${{ inputs.mode || 'auto' }}
          REPORT_SCHEDULE: ${{ github.event_name == 'schedule' && github.event.schedule || '' }}
          REFORMAT_EXISTING: ${{ inputs.reformat_existing == true && 'true' || 'false' }}
          CORRECT_EXISTING_DATE: ${{ inputs.correct_existing_date || '' }}
          PUBLISH: >-
            ${{ ((github.event_name == 'schedule' &&
            (((github.event.schedule == '0 0 * * 1' || github.event.schedule == '30 23 * * 0') && vars.MONDAY_REPORTS_ENABLED == 'true') ||
            ((github.event.schedule == '0 8 * * 5' || github.event.schedule == '30 7 * * 5') && vars.FRIDAY_REPORTS_ENABLED == 'true'))) ||
            (github.event_name == 'workflow_dispatch' && inputs.publish == true &&
            ((inputs.mode == 'monday' && vars.MONDAY_REPORTS_ENABLED == 'true') ||
            (inputs.mode == 'friday' && vars.FRIDAY_REPORTS_ENABLED == 'true')))) && 'true' || 'false' }}
        run: python3 weekly_report.py
