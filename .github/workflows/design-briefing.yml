name: Daily design briefing
on:
  schedule:
    # Prepare ahead, with repeated independent recovery attempts. UTC times.
    # Delivery is handled by Cloudflare at 09:05 KST, not by this scheduler.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      test_delivery:
        description: Send one explicitly marked live verification issue (requires temporary server-side test grant)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: design-public-briefing
  cancel-in-progress: false
jobs:
  briefing:
    if: vars.BRIEFING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Korean holiday calendar
        run: python3 -m pip install 'holidays==0.83'
      - name: Validate weekday routing and existing source checks
        run: python3 design_briefing.py --self-test
      - name: Prepare verified issue and enqueue for 09:05 KST
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_USER_ID: ${{ vars.SLACK_BOT_USER_ID }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
          BRIEFING_CHANNEL_ID: ${{ vars.BRIEFING_CHANNEL_ID }}
          BRIEFING_GROUP_MENTION: ${{ vars.BRIEFING_GROUP_MENTION }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL || 'gpt-4.1' }}
          BRIEFING_SEARCH_MODEL: ${{ vars.BRIEFING_SEARCH_MODEL || 'gpt-5-mini' }}
          BRIEFING_EXTRA_HOLIDAYS: ${{ vars.BRIEFING_EXTRA_HOLIDAYS || '[]' }}
          BRIEFING_EXCLUDED_URLS: ${{ secrets.BRIEFING_EXCLUDED_URLS || '[]' }}
          BRIEFING_TEST: ${{ inputs.test_delivery == true && 'true' || 'false' }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python3 prepare_briefing.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo '::error::No verified briefing queued after three attempts; next scheduled run retries.'
          exit 1
