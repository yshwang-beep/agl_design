name: Daily design workboard
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: Read-only connection check or source validation
        type: choice
        options: [preflight, validate, backfill]
        default: preflight
      backfill_dates:
        description: Explicit dates to reconstruct, comma-separated (requires an exact-run server grant)
        type: string
        default: ''
      publish:
        description: Publish approved historical records (requires a server grant for this exact run)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: design-workboard-monday
  cancel-in-progress: false
jobs:
  board:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BOARD_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline safety checks
        run: python3 -m unittest test_board_weekly.py test_weekly_report.py test_daily_board.py
      - name: Collect, validate, and update the Monday board
        env:
          BOARD_PHASE: ${{ github.event_name == 'schedule' && 'validate' || inputs.phase || 'preflight' }}
          BACKFILL_DATES: ${{ inputs.backfill_dates || '' }}
          BOARD_ENABLED: ${{ vars.BOARD_ENABLED }}
          PUBLISH: ${{ vars.BOARD_ENABLED == 'true' && (github.event_name == 'schedule' || (inputs.phase == 'backfill' && inputs.publish == true)) && 'true' || 'false' }}
          WORKBOARD_URL: ${{ vars.WORKBOARD_URL }}
          BOARD_CONFIG: ${{ secrets.BOARD_CONFIG }}
          BOARD_NOTICE_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_GROUP_MENTION: ${{ vars.SLACK_GROUP_MENTION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
          REPORT_POLICY: ${{ secrets.REPORT_POLICY }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import runpy

          config = json.loads(os.environ['BOARD_CONFIG'])
          config['notice_channel_id'] = os.environ['BOARD_NOTICE_CHANNEL_ID']
          os.environ['BOARD_CONFIG'] = json.dumps(config)
          runpy.run_path('daily_board.py', run_name='__main__')
          PYTHON
